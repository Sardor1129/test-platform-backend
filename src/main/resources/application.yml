server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
          maximum-pool-size: 5
          minimum-idle: 0
          max-lifetime: 300000
          idle-timeout: 120000
          connection-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  admin:
    login: admin
    password: ${ADMIN_PASSWORD}
  upload-dir: uploads
  mail:
      enabled: true
      from: ${MAIL_FROM}
      from-name: Test platforma
      brevo-api-key: ${BREVO_API_KEY}