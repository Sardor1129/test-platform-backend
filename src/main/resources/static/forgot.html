<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="forgotTitle">Parol tiklash</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
<div class="auth-page">
    <div class="auth-left">
        <img src="img/auth-illustration.png" alt="">
    </div>

    <div class="auth-right">
        <div class="auth-top">
            <div class="lang-tabs" id="langTabs"></div>
            <a href="register.html" class="btn btn-primary btn-small" data-i18n="register">Ro'yxatdan o'tish</a>
            <a href="index.html" class="btn btn-outline btn-small" data-i18n="signIn">Kirish</a>
        </div>

        <div class="auth-form-wrap">

            <!-- 1-bosqich: email -->
            <form class="auth-form" id="step1">
                <h1 data-i18n="forgotTitle">Parol tiklash</h1>
                <p class="hint" data-i18n="forgotHint">E-mail manzilingizga tekshiruv kodi yuboriladi</p>

                <div class="field">
                    <label for="email" data-i18n="email">E-mail</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </div>

                <div class="error-text" id="error1"></div>
                <button type="submit" class="btn btn-primary btn-block" id="submit1" data-i18n="confirmBtn">Tasdiqlash</button>
            </form>

            <!-- 2-bosqich: kod -->
            <form class="auth-form hidden" id="step2">
                <h1 data-i18n="forgotTitle">Parol tiklash</h1>
                <p class="hint" id="phoneHint"></p>

                <div class="field">
                    <label for="code" data-i18n="codeLabel">Tasdiqlash kodi</label>
                    <input type="text" id="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                </div>

                <div class="error-text" id="error2"></div>

                <div class="btn-row">
                    <button type="button" class="btn btn-gray" id="resendBtn" disabled>Qayta yuborish</button>
                    <button type="submit" class="btn btn-primary" id="submit2" data-i18n="signIn">Kirish</button>
                </div>
            </form>

            <!-- 3-bosqich: yangi parol -->
            <form class="auth-form hidden" id="step3">
                <h1 data-i18n="forgotTitle">Parol tiklash</h1>

                <div class="field">
                    <label for="newPassword" data-i18n="newPassword">Yangi parol kiriting</label>
                    <div class="password-wrap">
                        <input type="password" id="newPassword" autocomplete="new-password">
                        <button type="button" class="eye" data-target="newPassword">
                            <svg class="icon-on" viewBox="0 0 24 24">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-off" viewBox="0 0 24 24">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                                <line x1="3" y1="3" x2="21" y2="21"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword" data-i18n="newPasswordRepeat">Yangi parolni takrorlang</label>
                    <div class="password-wrap">
                        <input type="password" id="confirmPassword" autocomplete="new-password">
                        <button type="button" class="eye" data-target="confirmPassword">
                            <svg class="icon-on" viewBox="0 0 24 24">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-off" viewBox="0 0 24 24">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                                <line x1="3" y1="3" x2="21" y2="21"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="error-text" id="error3"></div>
                <button type="submit" class="btn btn-primary btn-block" id="submit3" data-i18n="signIn">Kirish</button>
            </form>

        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/forgot.js"></script>
</body>
</html>
