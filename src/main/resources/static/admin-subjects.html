<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanlar</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
        <h1 class="page-title">Fanlar</h1>

        <form class="panel" id="subjectForm">
            <h3 id="formTitle">Yangi fan qo'shish</h3>
            <div class="profile-grid">
                <div class="field">
                    <label for="nameUz">Nomi (O'zbek)</label>
                    <input type="text" id="nameUz">
                </div>
                <div class="field">
                    <label for="nameRu">Nomi (Русский)</label>
                    <input type="text" id="nameRu">
                </div>
                <div class="field">
                    <label for="nameEn">Nomi (English)</label>
                    <input type="text" id="nameEn">
                </div>
                <div class="field">
                    <label for="durationMinutes">Test vaqti (daqiqa)</label>
                    <input type="number" id="durationMinutes" min="1">
                </div>
                <div class="field">
                    <label for="questionCount">Testdagi savollar soni</label>
                    <input type="number" id="questionCount" min="1">
                </div>
                <div class="field">
                    <label for="passPercent">O'tish foizi (%)</label>
                    <input type="number" id="passPercent" min="1" max="100">
                </div>
                <div class="field">
                    <label for="categoryId">Kategoriya</label>
                    <select id="categoryId">
                        <option value="">Kategoriyasiz</option>
                    </select>
                </div>

            </div>

            <div class="error-text" id="error"></div>
            <div class="success-text" id="success"></div>

            <div class="profile-actions">
                <button type="submit" class="btn btn-primary" id="saveBtn">Saqlash</button>
                <button type="button" class="btn btn-outline hidden" id="cancelBtn">Bekor qilish</button>
            </div>
        </form>

        <div class="table-wrap">
            <table class="results-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nomi (uz)</th>
                    <th>Kategoriya</th>
                    <th>Vaqt</th>
                    <th>Savollar</th>
                    <th>O'tish foizi</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/admin-layout.js"></script>
<script src="js/admin-subjects.js"></script>
</body>
</html>
