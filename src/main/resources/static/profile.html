<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="menuProfile">Profil</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
        <div class="lang-tabs" id="langTabs"></div>

        <div class="profile-box">
            <img class="profile-avatar" id="avatar" alt="">

            <div class="avatar-actions">
                <input type="file" id="avatarInput" accept="image/png, image/jpeg, image/webp" class="hidden">
                <button type="button" class="btn btn-outline btn-small hidden" id="avatarBtn" data-i18n="changePhoto">Rasmni almashtirish</button>
            </div>

            <form id="profileForm">
                <div class="profile-grid">
                    <div class="field">
                        <label for="firstName" data-i18n="firstName">Ism</label>
                        <input type="text" id="firstName" disabled>
                    </div>
                    <div class="field">
                        <label for="email" data-i18n="email">E-mail</label>
                        <input type="text" id="email" disabled>
                    </div>
                    <div class="field">
                        <label for="login" data-i18n="login">Login</label>
                        <input type="text" id="login" disabled>
                    </div>

                </div>

                <div class="error-text" id="error"></div>
                <div class="success-text" id="success"></div>

                <div class="profile-actions">
                    <button type="button" class="btn btn-primary" id="editBtn" data-i18n="edit">Tahrirlash</button>
                    <button type="submit" class="btn btn-primary hidden" id="saveBtn" data-i18n="save">Saqlash</button>
                    <button type="button" class="btn btn-outline hidden" id="cancelBtn" data-i18n="cancel">Bekor qilish</button>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
